<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Interbank – Login (Admin)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center">
    <h1>Interbank – Admin</h1>
    <form id="loginForm">
      <label>
        Usuário (admin)
        <input type="text" id="user" required placeholder="admin">
      </label>
      <label>
        Senha
        <input type="password" id="pass" required placeholder="123">
      </label>
      <button type="submit">Entrar</button>
    </form>
    <p id="msg" class="msg"></p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value;

      if (user === 'admin' && pass === '123') {
        msg.textContent = 'Bem‑vindo, admin!';
        msg.style.color = 'green';
      } else {
        msg.textContent = 'Credenciais inválidas.';
        msg.style.color = 'red';
      }
    });
  </script>
</body>
</html>
