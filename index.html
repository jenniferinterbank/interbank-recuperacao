<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interbank | Recuperação de Crédito</title>
  <meta name="description" content="Cedentes, cobrança 10+ e negociações" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:#192e45;background:#f4f6fa;font-size:14px}
    button,input,select,textarea{font:inherit}
    button,a,input,select{outline-offset:3px}
    button{cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:inherit}
    aside{position:fixed;inset:0 auto 0 0;width:245px;background:#102b43;color:#bdcddd;padding:38px 22px;display:flex;flex-direction:column;z-index:20}
    .brand{color:white;font-size:32px;font-weight:900;letter-spacing:-2px}
    .brand span{font-size:19px;margin-left:9px;letter-spacing:1px}
    .brand-sub{font-size:9px;letter-spacing:2px;margin-top:8px;color:#83afc7}
    .nav-label{font-size:10px;letter-spacing:1.7px;margin:55px 14px 18px;color:#7893a8}
    nav{display:grid;gap:7px}
    nav button{padding:14px;border-radius:8px;text-align:left;width:100%}
    nav button.selected{background:#225274;color:white;font-weight:800}
    nav button:hover:not(.selected){background:#1d405d}
    .private{margin-top:auto;display:flex;gap:10px;border-top:1px solid #29445b;padding-top:24px;font-size:12px;color:#bcd7cf}
    small{display:block;font-size:11px;color:#788797;margin-top:6px}
    .private small{color:#7893a8}
    main{margin-left:245px;padding:0 36px;max-width:1800px;min-height:100vh;display:flex;flex-direction:column}
    header{height:77px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce3eb;font-size:12px;color:#708093}
    .refresh{padding:9px 12px;border:1px solid #dce3eb;border-radius:7px;background:white;color:#192e45;font-weight:500}
    .refresh:hover{background:#f8fafc}
    .heading{padding:33px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .eyebrow{font-size:10px;letter-spacing:2px;color:#468d96;font-weight:800;text-transform:uppercase}
    h1{font-size:32px;letter-spacing:-1px;margin:9px 0 10px;font-weight:900;color:#192e45}
    h2{font-size:17px;margin:0 0 10px;font-weight:900;color:#192e45}
    p{line-height:1.6}
    .heading p{margin:0;color:#748294}
    .primary{background:#176a78;color:white;padding:12px 17px;border-radius:7px;font-weight:800;white-space:nowrap}
    .primary:hover{background:#11525e}
    .primary:disabled{opacity:.6}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin-bottom:25px}
    .stat{background:white;border:1px solid #e0e6ee;padding:22px;border-radius:11px;box-shadow:0 3px 8px #102b4303}
    .stat span{font-size:12px;color:#708093}
    .stat strong{display:block;font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:14px;color:#192e45}
    .stat small{margin-top:9px}
    .compact{grid-template-columns:repeat(3,1fr)}
    .dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
    .panel{background:white;border:1px solid #e0e6ee;border-radius:11px;padding:25px;min-width:0}
    .panel-title{display:flex;justify-content:space-between;align-items:center}
    .panel-title button{font-size:12px;color:#176a78;font-weight:600}
    .muted{color:#8491a0;font-size:12px;margin-top:0}
    .priority{width:100%;padding:19px 0;border-bottom:1px solid #edf0f4;justify-content:space-between;text-align:left;gap:14px;display:flex;align-items:center}
    .priority:last-child{border-bottom:0}
    .priority:hover{background:#f9fbfd}
    .priority b{font-size:12px;font-weight:900;color:#192e45}
    .priority div:last-child{text-align:right;white-space:nowrap}
    .priority strong{font-size:13px;color:#192e45;font-weight:800}
    .priority small{max-width:350px}
    .analyst{margin:24px 0}
    .analyst>div:first-child{display:flex;justify-content:space-between;font-size:12px}
    .track{height:7px;background:#eef3f7;border-radius:5px;margin-top:12px;overflow:hidden}
    .track i{display:block;background:#2a8190;height:100%;border-radius:5px}
    .note{background:#f3f7fa;color:#6e8091;border-radius:7px;padding:14px;font-size:11px;line-height:1.7;margin-top:16px}
    .banner{margin-top:23px;border-radius:11px;background:#e6f1f1;padding:24px;display:flex;align-items:center;gap:20px;color:#215964}
    .banner p{margin:0;font-size:12px}
    .banner h2{margin-bottom:5px;color:#215964}
    .banner button{margin-left:auto;font-weight:bold;white-space:nowrap;color:#192e45}
    .filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .search{display:flex;align-items:center;gap:8px;border:1px solid #dce3eb;padding-left:12px;border-radius:6px;flex:1;min-width:200px;background:white;color:#708093}
    .search input{border:0;width:100%;outline:none}
    input,select,textarea{border:1px solid #dce3eb;border-radius:6px;padding:11px;background:white;color:#283b4c}
    select{max-width:240px}
    .secondary{border:1px solid #dce3eb;padding:10px 13px;border-radius:6px;background:white;color:#192e45;font-weight:500}
    .secondary:hover{background:#f5f8fb}
    .danger-btn{border:1px solid #f5c2c7;padding:8px 12px;border-radius:6px;background:#fff5f5;color:#b42318;font-size:12px;font-weight:600}
    .danger-btn:hover{background:#fee4e2}
    .table-note{display:flex;justify-content:space-between;gap:15px;color:#8491a0;font-size:11px;margin-bottom:18px;align-items:center}
    .table-note label{color:#365366;display:flex;align-items:center;gap:6px;cursor:pointer}
    .table-wrap{overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:850px;text-align:left}
    th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#73869a;background:#f5f8fb;padding:14px 10px;font-weight:900}
    td{padding:18px 10px;border-bottom:1px solid #edf0f4;font-size:12px;max-width:290px;vertical-align:middle}
    td b{font-weight:900;color:#192e45}
    td small{line-height:1.5}
    .amount{font-weight:800;white-space:nowrap;color:#192e45}
    .badge{display:inline-block;background:#edf2f8;color:#496789;border-radius:5px;padding:6px 8px;font-size:10px;font-weight:700}
    .badge.green{color:#2c7c5a;background:#e5f4ec}
    .badge.orange{color:#aa6b22;background:#fff1dc}
    .good{color:#28815d}
    .warn{color:#b47529}
    .edit{color:#176a78;font-size:11px;white-space:nowrap;font-weight:700}
    .edit:hover{text-decoration:underline}
    .empty{text-align:center;padding:70px 20px;color:#8294a4}
    .empty svg{color:#3b8491;margin-bottom:15px}
    .empty h2{color:#38546b}
    .empty p{font-size:13px}
    .source{display:flex;align-items:center;gap:16px;text-decoration:none;color:#254c69;padding:20px 0;border-bottom:1px solid #e5eaf0;transition:background .15s}
    .source:hover{background:#f9fbfd}
    .source .source-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
    .source-meta{font-size:11px;color:#788797;font-weight:400;margin-left:8px}
    .history{padding:18px;border-bottom:1px solid #edf0f4}
    .history summary{cursor:pointer;font-weight:600}
    pre{white-space:pre-wrap;font-size:11px;background:#f5f8fb;padding:12px;border-radius:6px;margin-top:10px}
    footer{display:flex;justify-content:space-between;font-size:10px;color:#8b9aaa;padding:30px 0;margin-top:auto}
    .alert,.success{padding:14px 18px;border-radius:7px;margin-bottom:18px;background:#fff0eb;color:#a34734;display:flex;justify-content:space-between;align-items:center}
    .success{background:#e2f2e9;color:#2c7655;cursor:pointer}
    .loading{color:#6b7c8d}
    .overlay{position:fixed;inset:0;background:#102b4370;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
    .modal{background:white;border-radius:12px;width:820px;max-width:100%;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 25px 80px #102b4340}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-head h2{margin-top:8px;font-size:24px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
    .form-grid label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#192e45}
    .form-grid select{max-width:none}
    .form-grid .full{grid-column:1/-1}
    textarea{min-height:90px;resize:vertical}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:22px;flex-wrap:wrap}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .signin{color:#176a78;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
    .signin:hover{text-decoration:underline}
    .charts-heading{margin:32px 0 18px}
    .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .chart-panel{min-width:0;display:flex;flex-direction:column}
    .chart-canvas{width:100%;height:320px;position:relative;display:flex;flex-direction:column;justify-content:center}
    .chart-data{font-size:11px;color:#708093;margin-top:12px}
    .chart-data summary{cursor:pointer;user-select:none;padding:4px 0}
    .chart-data summary:hover{color:#176a78}
    .chart-data table{min-width:0;width:100%;margin-top:8px}
    .chart-data th{font-size:10px;padding:8px}
    .chart-data td{padding:8px;font-size:11px}
    .chart-data td:last-child{font-weight:700;white-space:nowrap}
    .chart-empty{height:280px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8b9aaa;font-size:12px}
    .chart-percent-note{font-size:10px;line-height:1.5;color:#6e8091;margin:0 0 10px}

    /* Upload Box for XLSX in Planilhas de Origem */
    .upload-zone{border:2px dashed #cbd5e1;border-radius:11px;padding:28px;text-align:center;background:#f8fafc;transition:border-color .2s,background .2s;margin-bottom:22px}
    .upload-zone.dragover{border-color:#176a78;background:#e6f1f1}
    .upload-zone h3{margin:10px 0 6px;font-size:15px;color:#192e45;font-weight:800}
    .upload-zone p{margin:0 0 16px;font-size:12px;color:#6e8091}
    .upload-controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .upload-controls select{padding:9px 12px;font-size:12px;border-radius:6px}

    /* Custom SVG Chart Tooltip & Legend */
    .svg-tooltip{position:fixed;pointer-events:none;background:white;border:1px solid #dce3eb;box-shadow:0 4px 12px rgba(16,43,67,.12);padding:8px 12px;border-radius:6px;font-size:12px;color:#192e45;z-index:999;display:none;white-space:nowrap}
    .svg-tooltip b{display:block;margin-bottom:2px;color:#102b43}
    .svg-tooltip span{color:#176a78;font-weight:700}
    .pie-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;padding:6px 10px 0;font-size:11px;line-height:1.4}
    .pie-legend-item{display:inline-flex;align-items:center;gap:5px}
    .pie-legend-swatch{width:10px;height:10px;display:inline-block;flex-shrink:0}
    .bar-grid-line{stroke:#e7edf2}
    .bar-axis-line{stroke:#666}
    .bar-axis-text{fill:#666}
    .bar-pct-text{fill:#365366}

    /* Header Theme, Supabase & User Controls */
    .theme-btn,.db-btn{padding:8px 12px;border:1px solid #dce3eb;border-radius:7px;background:white;color:#192e45;font-weight:600;font-size:12px;transition:background .15s,border-color .15s}
    .theme-btn:hover,.db-btn:hover{background:#f8fafc}
    .db-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#94a3b8}
    .db-dot.online{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
    .db-dot.syncing{background:#3b82f6;animation:pulseDot 1s infinite}
    .db-dot.error{background:#f59e0b}
    @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
    .user-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;background:#eaf2f6;color:#176a78;font-weight:700;font-size:12px}
    .logout-btn{padding:8px 11px;border:1px solid #dce3eb;border-radius:7px;background:white;color:#708093;font-size:12px;font-weight:600}
    .logout-btn:hover{color:#b42318;border-color:#f5c2c7;background:#fff5f5}

    /* Employee Login Screen */
    .login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0c2135 0%,#102b43 55%,#174c5f 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;overflow:auto}
    .login-card{background:white;color:#192e45;width:450px;max-width:100%;border-radius:16px;padding:34px 32px;box-shadow:0 28px 90px rgba(0,0,0,.38);position:relative}
    .login-top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
    .login-brand{font-size:30px;font-weight:900;letter-spacing:-1.5px;color:#102b43;line-height:1}
    .login-brand span{font-size:17px;margin-left:8px;letter-spacing:1px;color:#176a78}
    .login-brand-sub{font-size:9px;letter-spacing:2px;margin-top:6px;color:#6e8091;font-weight:700}
    .login-card h2{font-size:21px;margin:10px 0 6px;color:#192e45}
    .login-card p.login-sub{margin:0 0 20px;font-size:12px;color:#708093}
    .login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;font-size:12px;font-weight:700;color:#192e45}
    .login-field input,.login-field select{width:100%;max-width:none;padding:12px;font-size:13px}
    .login-quick{margin-bottom:18px}
    .login-quick-label{font-size:11px;color:#708093;margin-bottom:8px;display:block;font-weight:600}
    .login-chips{display:flex;flex-wrap:wrap;gap:6px}
    .login-chip{padding:6px 11px;border-radius:999px;border:1px solid #dce3eb;background:#f8fafc;color:#283b4c;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .login-chip:hover,.login-chip.active{background:#176a78;color:white;border-color:#176a78}
    .login-submit{width:100%;justify-content:center;padding:13px;font-size:14px;margin-top:4px}
    .login-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#94a3b8;font-size:11px}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
    .login-guest-btn{width:100%;justify-content:center;padding:11px;font-size:12px;font-weight:700}
    .login-hint{margin-top:16px;padding:11px 13px;border-radius:8px;background:#f3f7fa;color:#5c7084;font-size:11px;line-height:1.5}

    /* ═══════════════════════════════════════════════════════════════════════
       MODO ESCURO (DARK MODE)
       ═══════════════════════════════════════════════════════════════════════ */
    body.dark{background:#0b1521;color:#e2e8f0}
    body.dark aside{background:#071019;border-right:1px solid #172a3d;color:#94a3b8}
    body.dark .private{border-top-color:#172a3d;color:#9bd2c8}
    body.dark header{border-bottom-color:#1a2c3e;color:#94a3b8}
    body.dark h1,body.dark h2,body.dark .stat strong,body.dark .priority b,body.dark .priority strong,body.dark td b,body.dark .amount,body.dark .upload-zone h3{color:#f1f5f9}
    body.dark .heading p,body.dark .muted,body.dark .stat span,body.dark small,body.dark .table-note,body.dark .chart-percent-note,body.dark .chart-data{color:#94a3b8}
    body.dark .stat,body.dark .panel,body.dark .modal{background:#111f30;border-color:#1e334a;box-shadow:0 4px 16px rgba(0,0,0,.28)}
    body.dark .refresh,body.dark .theme-btn,body.dark .db-btn,body.dark .secondary,body.dark .logout-btn{background:#15263b;border-color:#263e59;color:#e2e8f0}
    body.dark .refresh:hover,body.dark .theme-btn:hover,body.dark .db-btn:hover,body.dark .secondary:hover{background:#1d334f}
    body.dark .logout-btn:hover{background:#3b181d;border-color:#7f1d1d;color:#fca5a5}
    body.dark .user-pill{background:#133844;color:#67e8f9}
    body.dark .priority{border-bottom-color:#1c3047}
    body.dark .priority:hover,body.dark .source:hover{background:#16283d}
    body.dark .track{background:#1c3047}
    body.dark .note{background:#0d1826;color:#94a3b8;border:1px solid #1a2e44}
    body.dark .banner{background:#12333b;color:#a7f3d0;border:1px solid #1d4e5a}
    body.dark .banner h2{color:#ecfeff}
    body.dark .banner button{color:#67e8f9}
    body.dark .search,body.dark input,body.dark select,body.dark textarea{background:#0c1826;border-color:#243b55;color:#f1f5f9}
    body.dark .search input{background:transparent;color:#f1f5f9}
    body.dark .table-note label,body.dark .form-grid label{color:#cbd5e1}
    body.dark th{background:#0d1826;color:#94a3b8;border-bottom:1px solid #1e334a}
    body.dark td{border-bottom-color:#1a2c3e;color:#cbd5e1}
    body.dark .badge{background:#1c324a;color:#93c5fd}
    body.dark .badge.green{background:#0f392b;color:#6ee7b7}
    body.dark .badge.orange{background:#422811;color:#fdba74}
    body.dark .good{color:#34d399}
    body.dark .warn{color:#fbbf24}
    body.dark .edit,body.dark .signin,body.dark .panel-title button{color:#38bdf8}
    body.dark .source{color:#cbd5e1;border-bottom-color:#1a2c3e}
    body.dark .history{border-bottom-color:#1a2c3e}
    body.dark pre{background:#09121d;color:#cbd5e1;border:1px solid #1a2c3e}
    body.dark .upload-zone{background:#0d1826;border-color:#263e59}
    body.dark .upload-zone.dragover{background:#12333b;border-color:#2dd4bf}
    body.dark .svg-tooltip{background:#0d1826;border-color:#263e59;color:#f1f5f9;box-shadow:0 6px 20px rgba(0,0,0,.5)}
    body.dark .svg-tooltip b{color:#f8fafc}
    body.dark .svg-tooltip span{color:#38bdf8}
    body.dark .bar-grid-line{stroke:#1e334a}
    body.dark .bar-axis-line{stroke:#64748b}
    body.dark .bar-axis-text{fill:#94a3b8}
    body.dark .bar-pct-text{fill:#cbd5e1}
    body.dark .danger-btn{background:#2c1215;border-color:#691b22;color:#fca5a5}
    body.dark .danger-btn:hover{background:#42181d}
    body.dark .alert{background:#351614;color:#fca5a5;border:1px solid #6b231e}
    body.dark .success{background:#0f3325;color:#6ee7b7;border:1px solid #1b563f}
    body.dark .login-card{background:#111f30;color:#f1f5f9;border:1px solid #243b55}
    body.dark .login-brand{color:#ffffff}
    body.dark .login-brand span{color:#38bdf8}
    body.dark .login-card h2,body.dark .login-field{color:#f1f5f9}
    body.dark .login-chip{background:#15263b;border-color:#263e59;color:#cbd5e1}
    body.dark .login-chip:hover,body.dark .login-chip.active{background:#176a78;color:white;border-color:#176a78}
    body.dark .login-divider::before,body.dark .login-divider::after{background:#1e334a}
    body.dark .login-hint{background:#0c1826;color:#94a3b8;border:1px solid #1e334a}

    @media(min-width:1500px){main{padding:0 50px}.stat strong{font-size:30px}}
    @media(max-width:1100px){aside{width:200px;padding:30px 16px}.brand{font-size:25px}.brand span{font-size:15px}main{margin-left:200px;padding:0 24px}.stats{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr}.banner{flex-wrap:wrap}}
    @media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
    @media(max-width:700px){aside{position:static;width:100%;padding:20px}.brand-sub,.nav-label,.private{display:none}nav{display:flex;overflow:auto;margin-top:18px}nav button{white-space:nowrap;padding:10px;font-size:12px;width:auto}main{margin-left:0;padding:0 16px}header{height:auto;min-height:55px;padding:10px 0;flex-wrap:wrap;gap:8px}.heading{align-items:flex-start;flex-direction:column}h1{font-size:25px}.heading p{font-size:12px}.heading .primary{font-size:11px;padding:10px}.stats{gap:10px}.stat{padding:15px}.stat strong{font-size:20px}.panel{padding:17px}.table-note{flex-direction:column;align-items:flex-start}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.modal{padding:20px}.banner button{margin-left:0}footer span{display:none}.header-actions{gap:6px;flex-wrap:wrap}.signin{font-size:10px}.chart-canvas{height:300px}.login-card{padding:24px 20px}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">LS<span>INTERBANK</span></div>
    <div class="brand-sub">RECUPERAÇÃO DE CRÉDITO</div>
    <div class="nav-label">ÁREA DE TRABALHO</div>
    <nav id="sidebar-nav"></nav>
    <div class="private" id="sidebar-private"></div>
  </aside>

  }

    btn.innerHTML = state.theme === 'dark'
      ? `${ICONS.sun} Modo claro`
      : `${ICONS.moon} Modo escuro`;

function getCurrentActorName() {

function renderSupabaseStatus() {
  const btn = document.getElementById('supabase-status-btn');
  if (!btn) return;
  if (state.sbStatus === 'online') {
    btn.innerHTML = `<i class="db-dot online"></i> Supabase ativo`;
    btn.title = 'Conectado ao Supabase em tempo real (Clique para opções)';
  } else if (state.sbStatus === 'syncing') {
    btn.innerHTML = `<i class="db-dot syncing"></i> Sincronizando…`;
    btn.title = 'Sincronizando dados com o Supabase…';
  } else if (state.sbStatus === 'error') {
    btn.innerHTML = `<i class="db-dot error"></i> Supabase (Atenção)`;
    btn.title = state.sbMessage || 'Erro ao conectar no Supabase. Clique para configurar.';
  } else {
    btn.innerHTML = `<i class="db-dot"></i> Conectar Supabase`;
    btn.title = 'Clique para configurar a URL e Chave do Supabase';
  }
}

function parseSupabaseRecordRow(row) {
  if (!row) return null;
  let parsed = {};
  if (typeof row.data === 'string') {
    try { parsed = JSON.parse(row.data); } catch { parsed = {}; }
  } else if (row.data && typeof row.data === 'object') {
    parsed = row.data;
  }
  return {
    ...parsed,
    id: row.id || parsed.id,
    kind: row.kind || parsed.kind || 'cobrancas',
    revision: Number(row.revision || parsed.revision || 1)
  };
}

async function initSupabase(autoSync = true) {
  const url = (state.sbUrl || '').trim();
  const key = (state.sbKey || '').trim();
  if (!url || !key || !window.supabase) {
    supabaseClient = null;
    state.sbStatus = 'unconfigured';
    renderSupabaseStatus();
    return false;
  }

  try {
    supabaseClient = window.supabase.createClient(url, key, {
      auth: { persistSession: false }
    });
    if (autoSync) {
      await syncFromSupabase();
      subscribeSupabaseRealtime();
    }
    return true;
  } catch (err) {
    console.error('Erro ao inicializar cliente Supabase:', err);
    state.sbStatus = 'error';
    state.sbMessage = err.message || 'URL ou Anon Key inválida.';
    renderSupabaseStatus();
    return false;
  }
}

function subscribeSupabaseRealtime() {
  if (!supabaseClient) return;
  try {
    if (realtimeChannel) {
      supabaseClient.removeChannel(realtimeChannel);
    }
    realtimeChannel = supabaseClient
      .channel('interbank-realtime-db')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, () => {
        syncFromSupabase(true);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'history' }, () => {
        syncFromSupabase(true);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'sources' }, () => {
        syncFromSupabase(true);
      })
      .subscribe();
  } catch (e) {
    console.warn('Realtime não habilitado:', e);
  }
}

async function syncFromSupabase(silent = false) {
  if (!supabaseClient) return;
  if (!silent) {
    state.sbStatus = 'syncing';
    renderSupabaseStatus();
  }

  try {
    const { data: recRows, error: recErr } = await supabaseClient
      .from('records')
      .select('id, kind, data, revision');

    if (recErr) throw recErr;

    if (Array.isArray(recRows) && recRows.length > 0) {
      state.rows = recRows.map(parseSupabaseRecordRow).filter(Boolean);
      saveRowsLocalOnly();
    } else if (Array.isArray(recRows) && recRows.length === 0 && state.rows.length > 0) {
      // Banco no Supabase está vazio: envia automaticamente os 173 registros iniciais!
      await dbUpsertRecords(state.rows);
    }

    const { data: histRows, error: histErr } = await supabaseClient
      .from('history')
      .select('id, record_id, at, actor, data')
      .order('at', { ascending: false })
      .limit(200);

    if (!histErr && Array.isArray(histRows)) {
      state.history = histRows.map(h => ({
        id: h.id,
        recordId: h.record_id,
        at: h.at,
        actor: h.actor,
        data: typeof h.data === 'string' ? h.data : JSON.stringify(h.data)
      }));
      saveHistoryLocalOnly();
    }

    const { data: srcRows, error: srcErr } = await supabaseClient
      .from('sources')
      .select('name, uploaded_at, imported_count, data_url');

    if (!srcErr && Array.isArray(srcRows)) {
      state.customSources = srcRows.map(s => ({
        name: s.name,
        uploadedAt: s.uploaded_at,
        importedCount: s.imported_count || 0,
        dataUrl: s.data_url || null
      }));
      saveCustomSourcesLocalOnly();
    }

    state.sbStatus = 'online';
    state.sbMessage = `Sincronizado (${state.rows.length} registros no Supabase)`;
    renderSupabaseStatus();
    renderWorkspaceContent();
    renderChartsSection();
    if (state.showSupabaseModal) renderSupabaseModal();
  } catch (err) {
    console.error('Erro ao sincronizar com Supabase:', err);
    state.sbStatus = 'error';
    state.sbMessage = err.message || 'Verifique se as tabelas records, history e sources foram criadas no SQL Editor.';
    renderSupabaseStatus();
    if (state.showSupabaseModal) renderSupabaseModal();
  }
}

async function dbUpsertRecords(recordsList) {
  if (!supabaseClient || !recordsList || !recordsList.length) return;
  state.sbStatus = 'syncing';
  renderSupabaseStatus();
  try {
    const payload = recordsList.map(r => ({
      id: String(r.id),
      kind: String(r.kind || 'cobrancas'),
      data: JSON.stringify(r),
      revision: Number(r.revision || 1)
    }));

    const chunkSize = 100;
    for (let i = 0; i < payload.length; i += chunkSize) {
      const chunk = payload.slice(i, i + chunkSize);
      const { error } = await supabaseClient.from('records').upsert(chunk, { onConflict: 'id' });
      if (error) throw error;
    }
    state.sbStatus = 'online';
    state.sbMessage = `Salvo no Supabase (${state.rows.length} registros)`;
  } catch (err) {
    console.error('Erro ao salvar registro(s) no Supabase:', err);
    state.sbStatus = 'error';
    state.sbMessage = 'Falha ao salvar no Supabase: ' + (err.message || '');
  }
  renderSupabaseStatus();
}

async function dbDeleteRecords(idsList) {
  if (!supabaseClient || !idsList || !idsList.length) return;
  state.sbStatus = 'syncing';
  renderSupabaseStatus();
  try {
    const { error } = await supabaseClient.from('records').delete().in('id', idsList);
    if (error) throw error;
    state.sbStatus = 'online';
  } catch (err) {
    console.error('Erro ao excluir no Supabase:', err);
    state.sbStatus = 'error';
    state.sbMessage = 'Falha ao excluir no Supabase: ' + (err.message || '');
  }
  renderSupabaseStatus();
}

async function dbInsertHistory(entry) {
  if (!supabaseClient || !entry) return;
  try {
    const { error } = await supabaseClient.from('history').upsert({
      id: String(entry.id),
      record_id: String(entry.recordId || 'geral'),
      at: String(entry.at),
      actor: String(entry.actor || 'Colaborador'),
      data: typeof entry.data === 'string' ? entry.data : JSON.stringify(entry.data)
    }, { onConflict: 'id' });
    if (error) console.warn('Aviso ao gravar history no Supabase:', error.message);
  } catch (err) {
    console.warn('Erro ao gravar history no Supabase:', err);
  }
}

async function dbUpsertSource(sourceEntry) {
  if (!supabaseClient || !sourceEntry) return;
  try {
    // Evita enviar dataUrl muito grande caso ultrapasse limite; envia até ~1.5MB ou só metadados
    const safeDataUrl = sourceEntry.dataUrl && sourceEntry.dataUrl.length < 1500000 ? sourceEntry.dataUrl : null;
    await supabaseClient.from('sources').upsert({
      name: sourceEntry.name,
      uploaded_at: sourceEntry.uploadedAt || new Date().toLocaleString('pt-BR'),
      imported_count: Number(sourceEntry.importedCount || 0),
      data_url: safeDataUrl
    }, { onConflict: 'name' });
  } catch (err) {
    console.warn('Erro ao salvar source no Supabase:', err);
  }
}

async function dbDeleteSource(name) {
  if (!supabaseClient || !name) return;
  try {
    await supabaseClient.from('sources').delete().eq('name', name);
  } catch (err) {
    console.warn('Erro ao remover source no Supabase:', err);
  }
}

async function pushAllLocalToSupabase() {
  if (!supabaseClient) {
    state.error = 'Configure a URL e a Anon Key do Supabase primeiro.';
    renderSupabaseModal();
    return;
  }
  await dbUpsertRecords(state.rows);
  for (const s of state.customSources) {
    await dbUpsertSource(s);
  }
  state.notice = `Todos os ${state.rows.length} registros foram enviados e sincronizados no Supabase!`;
  renderAll();
}

function loadState() {
  try {
    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme);
    state.theme = savedTheme === 'dark' ? 'dark' : 'light';
    applyTheme();

    const savedSb = localStorage.getItem(STORAGE_KEYS.supabaseCfg);
    if (savedSb) {
      try {
        const parsedSb = JSON.parse(savedSb);
        if (parsedSb.url) state.sbUrl = parsedSb.url;
        if (parsedSb.key) state.sbKey = parsedSb.key;
      } catch {}
    }

    const savedSession = localStorage.getItem(STORAGE_KEYS.session);
    if (savedSession) {
      const parsedSession = JSON.parse(savedSession);
      if (parsedSession && parsedSession.mode === 'guest') {
        state.user = null;
        state.canEdit = false;
        state.showLogin = false;
      } else if (parsedSession && parsedSession.name) {
        state.user = parsedSession;
        state.canEdit = true;
        state.showLogin = false;
      } else {
        state.showLogin = true;
      }
    } else {
      state.showLogin = true;
      state.canEdit = false;
    }

    const savedRows = localStorage.getItem(STORAGE_KEYS.records);
    if (savedRows) {
      const parsed = JSON.parse(savedRows);
      if (Array.isArray(parsed) && parsed.length > 0) {
        state.rows = parsed;
      } else {
        state.rows = JSON.parse(JSON.stringify(SEED_RECORDS));
        saveRowsLocalOnly();
      }
    } else {
      state.rows = JSON.parse(JSON.stringify(SEED_RECORDS));
      saveRowsLocalOnly();
    }

    const savedHistory = localStorage.getItem(STORAGE_KEYS.history);
    state.history = savedHistory ? JSON.parse(savedHistory) : [];

    const savedSources = localStorage.getItem(STORAGE_KEYS.sources);
    state.customSources = savedSources ? JSON.parse(savedSources) : [];
  } catch (e) {
    console.error('Erro ao carregar dados locais:', e);
    state.rows = JSON.parse(JSON.stringify(SEED_RECORDS));
  }
}

function saveRowsLocalOnly() {
  try {
    localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(state.rows));
  } catch (e) {
    console.error('Erro ao salvar registros localmente:', e);

}

// FUNÇÕES UTILITÁRIAS (idênticas ao app/workspace.tsx e app/charts.tsx)
// ══════════════════════════════════════════════════════════════════════════
function money(n) {
  return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function today() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Sao_Paulo',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(new Date());
}

function days(v) {
  return /^\d{4}-\d{2}-\d{2}$/.test(v || '')
    ? Math.max(0, Math.floor((Date.parse(today() + 'T12:00:00Z') - Date.parse(v + 'T12:00:00Z')) / 86400000))
    : null;
}

function closed(r) {
  return r.status === 'Pago' || r.status === 'Liquidado';
}

function calls(r) {
  return [r.ligacao1, r.ligacao2, r.ligacao3].filter(Boolean).length;
}

function total(rs, k = 'valor') {
  return rs.reduce((s, r) => s + Number(r[k] || 0), 0);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function group(rows, key, valueKey) {
  const map = new Map();
  for (const r of rows) {
    const label = String(r[key] || 'Não informado').trim() || 'Não informado';
    map.set(label, (map.get(label) || 0) + (valueKey ? Number(r[valueKey] || 0) : 1));
  }
  return [...map].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
}

function percentage(value, totalVal) {
  return totalVal > 0
    ? (value / totalVal * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'
    : '0,0%';
}

function getFilteredRows() {
  const { rows, tab, query, analyst, status, min } = state;
  const q = query.trim().toLowerCase();
  return rows.filter(r =>
    r.kind === tab &&
    !r.arquivado &&
    (!q || JSON.stringify(r).toLowerCase().includes(q)) &&
    (!analyst || (r.analista || '').trim().toLowerCase() === analyst.toLowerCase()) &&
    (!status || r.status === status) &&
    (!min || tab !== 'cobrancas' || Number(r.valor) > 10000)
  );
}

function showTooltip(evt, title, text) {
  const el = document.getElementById('svg-tooltip');
  if (!el) return;
  el.innerHTML = `<b>${escapeHtml(title)}</b><span>${escapeHtml(text)}</span>`;
  el.style.display = 'block';
  moveTooltip(evt);
}

function moveTooltip(evt) {
  const el = document.getElementById('svg-tooltip');
  if (!el || el.style.display === 'none') return;
  const x = Math.min(window.innerWidth - 220, evt.clientX + 14);
  const y = Math.max(12, evt.clientY - 38);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function hideTooltip() {
  const el = document.getElementById('svg-tooltip');
  if (el) el.style.display = 'none';
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = -angleDeg * Math.PI / 180;
  return {
    x: cx + r * Math.cos(rad),
    y: cy + r * Math.sin(rad)
  };
}

function describeDonutSector(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const span = Math.min(359.99, Math.max(0.01, endAngle - startAngle));
  const eAngle = startAngle + span;
  const largeArc = span > 180 ? 1 : 0;

  const p1 = polarToCartesian(cx, cy, rOuter, startAngle);
  const p2 = polarToCartesian(cx, cy, rOuter, eAngle);
  const p3 = polarToCartesian(cx, cy, rInner, eAngle);
  const p4 = polarToCartesian(cx, cy, rInner, startAngle);

  return [
    `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
    `A ${rOuter} ${rOuter} 0 ${largeArc} 0 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
    `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
    `A ${rInner} ${rInner} 0 ${largeArc} 1 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
    'Z'
  ].join(' ');
}

function renderPieSvg(data, totalVal, currency) {
  const nonZero = data.filter(d => d.value > 0);
  const cx = 250, cy = 116, innerR = 48, outerR = 92;
  const padAngle = nonZero.length > 1 ? 2 : 0;
  const totalPad = padAngle * nonZero.length;
  const availDeg = 360 - totalPad;

  let currentAngle = 0;
  let pathsHtml = '';
  let labelsHtml = '';

  data.forEach((item, idx) => {
    if (item.value <= 0) return;
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    const sliceDeg = (item.value / totalVal) * availDeg;
    const startAngle = currentAngle + padAngle / 2;
    const endAngle = startAngle + sliceDeg;
    const midAngle = startAngle + sliceDeg / 2;
    currentAngle += sliceDeg + padAngle;

    const pctStr = percentage(item.value, totalVal);
    const amountStr = currency ? money(item.value) : `${item.value} registros`;
    const tipStr = `${amountStr} · ${pctStr}`;

    if (nonZero.length === 1) {
      const dPath = describeDonutSector(cx, cy, outerR, innerR, 0, 359.99);
      pathsHtml += `<path d="${dPath}" fill="${color}" stroke="#fff" stroke-width="1"
        onmouseenter="showTooltip(event, '${escapeHtml(item.name).replace(/'/g, "\\'")}', '${tipStr}')"
        onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()" />`;
      pathsHtml += `<line x1="${cx + innerR}" y1="${cy}" x2="${cx + outerR}" y2="${cy}" stroke="#fff" stroke-width="2" />`;
    } else {
      const dPath = describeDonutSector(cx, cy, outerR, innerR, startAngle, endAngle);
      pathsHtml += `<path d="${dPath}" fill="${color}"
        onmouseenter="showTooltip(event, '${escapeHtml(item.name).replace(/'/g, "\\'")}', '${tipStr}')"
        onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()" />`;
    }

    if (item.value / totalVal >= 0.06) {
      const labelR = innerR + (outerR - innerR) * 0.55;
      const pos = polarToCartesian(cx, cy, labelR, midAngle);
      labelsHtml += `<text x="${pos.x.toFixed(2)}" y="${pos.y.toFixed(2)}" fill="white" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" style="pointer-events:none">${pctStr}</text>`;
    }
  });

  const legendItems = data.map((item, idx) => ({
    ...item,
    color: CHART_COLORS[idx % CHART_COLORS.length],
    pct: percentage(item.value, totalVal)
  })).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

  const legendHtml = `<div class="pie-legend">${legendItems.map(it =>
    `<span class="pie-legend-item" style="color:${it.color}"><i class="pie-legend-swatch" style="background:${it.color}"></i><span>${escapeHtml(it.name)} · ${it.pct}</span></span>`
  ).join('')}</div>`;

  return `<svg viewBox="0 0 500 232" style="width:100%;height:245px;overflow:visible">${pathsHtml}${labelsHtml}</svg>${legendHtml}`;
}

function computeNiceAxisMax(maxVal) {
  if (maxVal <= 0) return { max: 100, ticks: [0, 25, 50, 75, 100] };
  const rawStep = maxVal / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep / mag;
  const niceSteps = [1, 1.5, 2, 2.5, 3, 4, 5, 5.5, 6, 8, 10];
  let step = mag * 10;
  for (const s of niceSteps) {
    if (s >= residual - 1e-9) {
      step = s * mag;
      break;
    }
  }
  const ticks = [0, step, step * 2, step * 3, step * 4];
  return { max: step * 4, ticks };
}

function formatAxisTick(v, currency) {
  if (!currency) return String(v);
  if (v === 0) return '0 mil';
  if (v >= 1000000) {
    return (v / 1000000).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi';
  }
  return (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
}

function renderBarSvg(data, totalVal, currency) {
  const maxVal = Math.max(...data.map(d => d.value), 0);
  const { max: axisMax, ticks } = computeNiceAxisMax(maxVal);

  const width = 560, height = 300;
  const left = 132, right = 66, top = 12, bottom = 32;
  const plotW = width - left - right;
  const plotH = height - top - bottom;
  const rowH = plotH / Math.max(data.length, 1);
  const barH = Math.min(27, Math.max(10, rowH * 0.66));

  let gridHtml = '';
  ticks.forEach(t => {
    const x = left + (t / axisMax) * plotW;
    gridHtml += `<line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${top + plotH}" class="bar-grid-line" stroke-dasharray="3 3" />`;
    gridHtml += `<line x1="${x.toFixed(1)}" y1="${top + plotH}" x2="${x.toFixed(1)}" y2="${top + plotH + 5}" class="bar-axis-line" />`;
    gridHtml += `<text x="${x.toFixed(1)}" y="${top + plotH + 18}" text-anchor="middle" font-size="10" class="bar-axis-text">${formatAxisTick(t, currency)}</text>`;
  });

  gridHtml += `<line x1="${left}" y1="${top}" x2="${left}" y2="${top + plotH}" class="bar-axis-line" />`;
  gridHtml += `<line x1="${left}" y1="${top + plotH}" x2="${left + plotW}" y2="${top + plotH}" class="bar-axis-line" />`;

  let barsHtml = '';
  data.forEach((item, idx) => {
    const cy = top + idx * rowH + rowH / 2;
    const by = cy - barH / 2;
    const bw = axisMax > 0 ? Math.max(0, (item.value / axisMax) * plotW) : 0;
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    const pctStr = percentage(item.value, totalVal);
    const amountStr = currency ? money(item.value) : `${item.value} registros`;
    const tipStr = `${amountStr} · ${pctStr}`;

    barsHtml += `<line x1="${left - 5}" y1="${cy.toFixed(1)}" x2="${left}" y2="${cy.toFixed(1)}" class="bar-axis-line" />`;
    barsHtml += `<text x="${left - 8}" y="${cy.toFixed(1)}" text-anchor="end" dominant-baseline="central" font-size="10" class="bar-axis-text">${escapeHtml(item.name)}</text>`;

    if (bw > 0) {
      const r = Math.min(4, bw / 2, barH / 2);
      const dBar = [
        `M ${left} ${by.toFixed(2)}`,
        `H ${(left + bw - r).toFixed(2)}`,
        `Q ${(left + bw).toFixed(2)} ${by.toFixed(2)} ${(left + bw).toFixed(2)} ${(by + r).toFixed(2)}`,
        `V ${(by + barH - r).toFixed(2)}`,
        `Q ${(left + bw).toFixed(2)} ${(by + barH).toFixed(2)} ${(left + bw - r).toFixed(2)} ${(by + barH).toFixed(2)}`,
        `H ${left}`,
        'Z'
      ].join(' ');
      barsHtml += `<path d="${dBar}" fill="${color}"
        onmouseenter="showTooltip(event, '${escapeHtml(item.name).replace(/'/g, "\\'")}', '${tipStr}')"
        onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()" />`;
      barsHtml += `<text x="${(left + bw + 6).toFixed(1)}" y="${cy.toFixed(1)}" dominant-baseline="central" font-size="11" class="bar-pct-text">${pctStr}</text>`;
    } else if (item.value === 0 && idx === 2 && data.length === 7) {
      barsHtml += `<text x="${(left + 5).toFixed(1)}" y="${cy.toFixed(1)}" dominant-baseline="central" font-size="11" class="bar-pct-text">0,0%</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:100%">${gridHtml}${barsHtml}</svg>`;
}

function buildChartPanel({ title, sub, data, currency = false, pie = false, baseTotal }) {
  const totalVal = baseTotal !== undefined ? baseTotal : data.reduce((s, r) => s + r.value, 0);
  const noteText = baseTotal !== undefined
    ? 'Percentuais sobre o valor total negociado (Negociado = 100%).'
    : 'Percentuais sobre o total da seleção deste gráfico.';

  const hasValues = data.length > 0 && data.some(r => r.value > 0);
  let bodyHtml = '';

  if (hasValues) {
    const svgContent = pie
      ? renderPieSvg(data, totalVal, currency)
      : renderBarSvg(data, totalVal, currency);

    const tableRows = data.map(r => `
      <tr>
        <td>${escapeHtml(r.name)}</td>
        <td>${currency ? money(r.value) : r.value}</td>
        <td>${percentage(r.value, totalVal)}</td>
      </tr>
    `).join('');

    bodyHtml = `
      <div class="chart-canvas">${svgContent}</div>
      <details class="chart-data">
        <summary>Ver valores e porcentagens</summary>
        <table>
          <thead>
            <tr>
              <th>Categoria</th>
              <th>${currency ? 'Valor' : 'Quantidade'}</th>
              <th>%</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </details>
    `;
  } else {
    bodyHtml = `<div class="chart-empty">Os gráficos aparecerão quando houver registros com valores.</div>`;
  }

  return `
    <article class="panel chart-panel">
      <h2>${escapeHtml(title)}</h2>
      <p class="muted">${escapeHtml(sub)}</p>
      <p class="chart-percent-note">${noteText}</p>
      ${bodyHtml}
    </article>
  `;
}

function renderChartsSection() {

    { name: '6 a 10 dias', value: 0 },
    { name: '11 a 15 dias', value: 0 },
    { name: '16 a 30 dias', value: 0 },
    { name: '31+ dias', value: 0 },
    { name: 'Sem vencimento válido', value: 0 }
  ];

  for (const r of active) {
    const d = /^\d{4}-\d{2}-\d{2}$/.test(r.vencimento || '')
      ? Math.floor((Date.parse(ref + 'T12:00:00Z') - Date.parse(r.vencimento + 'T12:00:00Z')) / 86400000)
      : NaN;
    const bucketIdx = !Number.isFinite(d) ? 6 : d <= 0 ? 0 : d <= 5 ? 1 : d <= 10 ? 2 : d <= 15 ? 3 : d <= 30 ? 4 : 5;
    aging[bucketIdx].value += Number(r.valor || 0);
  }

  const callsData = [
    { name: 'Meta cumprida', value: charges.filter(r => calls(r) >= 3).length },
    { name: 'Meta pendente', value: charges.filter(r => calls(r) < 3).length }
  ];

  const normalizedAnalystCharges = charges.map(r => {
    const raw = (r.analista || 'Não informado').trim().toLocaleLowerCase('pt-BR');
    const norm = raw ? raw.replace(/^./, s => s.toLocaleUpperCase('pt-BR')) : 'Não informado';
    return { ...r, analista: norm };
  });

  let panelsHtml = '';

  if (tab === 'dashboard' || tab === 'cobrancas') {
    panelsHtml += buildChartPanel({
      title: 'Cobranças por status',
      sub: 'Quantidade de registros da seleção',
      data: group(charges, 'status'),
      pie: true
    });
    panelsHtml += buildChartPanel({
      title: 'Valores por faixa de atraso',
      sub: 'Sem status Pago ou Liquidado · atraso atualizado hoje',
      data: aging,
      currency: true
    });
    panelsHtml += buildChartPanel({
      title: 'Carteira por analista',
      sub: 'Valor total dos registros da seleção',
      data: group(normalizedAnalystCharges, 'analista', 'valor'),
      currency: true
    });
    panelsHtml += buildChartPanel({
      title: 'Meta de ligações',
      sub: '3 resultados preenchidos por registro · na data da cobrança',
      data: callsData,
      pie: true
    });
  }

  if (tab === 'dashboard' || tab === 'cedentes') {
    panelsHtml += buildChartPanel({
      title: 'Situação dos protestos',
      sub: 'Quantidade de registros · inclui Recuperi',
      data: group(debtors, 'status'),
      pie: true
    });
    panelsHtml += buildChartPanel({
      title: 'Valores efetivamente protestados',
      sub: 'Campos preenchidos de valor protestado, por situação',
      data: group(debtors, 'status', 'valorProtestado'),
      currency: true
    });
  }

  if (tab === 'dashboard' || tab === 'negociacoes') {
    const negTotal = neg.reduce((s, r) => s + Number(r.valor || 0), 0);
    const recTotal = neg.reduce((s, r) => s + Number(r.recebido || 0), 0);
    panelsHtml += buildChartPanel({
      title: 'Evolução das negociações',
      sub: 'Quantidade de registros por status',
      data: group(neg, 'status'),
      pie: true
    });
    panelsHtml += buildChartPanel({
      title: 'Negociado e recebido',
      sub: 'Valores acumulados informados nos acordos',
      baseTotal: negTotal,
      data: neg.length ? [
        { name: 'Negociado', value: negTotal },
        { name: 'Recebido', value: recTotal },
        { name: 'Saldo', value: negTotal - recTotal }
      ] : [],
      currency: true
    });
  }

  container.innerHTML = `
    <div class="charts-heading">
      <h2>Indicadores da carteira</h2>
      <p class="muted">${tab === 'dashboard' ? 'Visão consolidada dos registros salvos.' : 'Os gráficos acompanham os filtros selecionados.'}</p>
    </div>
    <section class="charts-grid">${panelsHtml}</section>
  `;
}

// IMPORTAÇÃO E ANEXO DE PLANILHAS (.XLSX / .XLS / .CSV)
// ══════════════════════════════════════════════════════════════════════════
function normHeader(h) {
  return String(h || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function parseExcelDate(val) {
  if (val === null || val === undefined || val === '') return null;
  if (val instanceof Date && !isNaN(val.getTime())) {
    return val.toISOString().slice(0, 10);
  }
  if (typeof val === 'number' && val > 20000 && val < 90000) {
    const utcDays = Math.floor(val - 25569);
    const d = new Date(utcDays * 86400 * 1000);
    if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  }
  const s = String(val).trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const dd = m[1].padStart(2, '0');
    const mm = m[2].padStart(2, '0');
    const yyyy = m[3];
    return `${yyyy}-${mm}-${dd}`;
  }
  return s;
}

function parseExcelNumber(val) {
  if (val === null || val === undefined || val === '') return null;
  if (typeof val === 'number') return Number.isFinite(val) ? val : null;
  let s = String(val).replace(/R\$/gi, '').replace(/\s+/g, '').trim();
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function inferAnalystFromFileName(fileName) {
  const up = fileName.toUpperCase();
  if (up.includes('JENNIFER')) return 'Jennifer';
  if (up.includes('MICAEL')) return 'Micael';
  if (up.includes('QUEILA')) return 'Queila';
  if (up.includes('THAIS')) return 'Thais';
  return '';
}

function parseSheetRows(aoa, sheetName, fileName, forcedKind, defaultAnalyst) {
  if (!aoa || aoa.length < 2) return [];

  let headerRowIdx = -1;
  let bestScore = 0;
  for (let r = 0; r < Math.min(aoa.length, 12); r++) {
    const row = aoa[r] || [];
    const joined = row.map(normHeader).join(' | ');
    let score = 0;
    ['cedente','sacado','cliente','valor','vencimento','titulo','status','protesto','situacao','analista','entrada','parcelas'].forEach(kw => {
      if (joined.includes(kw)) score++;
    });
    if (score > bestScore && score >= 2) {
      bestScore = score;
      headerRowIdx = r;
    }
  }
  if (headerRowIdx === -1) headerRowIdx = 0;

  const headers = (aoa[headerRowIdx] || []).map(normHeader);
  const hasHeader = (patterns) => headers.findIndex(h => patterns.some(p => h === p || h.includes(p)));

  let kind = forcedKind;
  if (!kind || kind === 'auto') {
    const sNorm = normHeader(sheetName + ' ' + fileName);
    if (hasHeader(['valor da np', 'valor np', 'valor protestado', 'situacao do protesto', 'envio a protesto', 'avalistas']) !== -1 || sNorm.includes('protesto') || sNorm.includes('recuperi')) {
      kind = 'cedentes';
    } else if (hasHeader(['valor negociado', 'entrada prevista', 'quantidade de parcelas', 'recebido acumulado', 'cronograma']) !== -1 || sNorm.includes('negocia')) {
      kind = 'negociacoes';
    } else {
      kind = 'cobrancas';
    }
  }

  const imported = [];
  const originLabel = `${fileName} · ${sheetName}`;
  const inferredAnalyst = defaultAnalyst || inferAnalystFromFileName(fileName);

  for (let r = headerRowIdx + 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (!row || !row.length) continue;

    const getVal = (patterns) => {
      const idx = hasHeader(patterns);
      if (idx === -1) return null;
      const v = row[idx];
      return v === undefined || v === '' ? null : v;
    };

    if (kind === 'cedentes') {
      const cedente = getVal(['cedente', 'empresa', 'cliente']);
      const valorNP = parseExcelNumber(getVal(['valor da np', 'valor np', 'valor titulo']));
      const valorProtestado = parseExcelNumber(getVal(['valor protestado', 'protestado']));
      if (!cedente || /^(total|soma|media|resumo)$/i.test(String(cedente).trim())) continue;

      imported.push({
        id: 'cedentes-' + crypto.randomUUID().slice(0, 8),
        kind: 'cedentes',
        cedente: String(cedente).trim(),
        valorNP: valorNP,
        valorProtestado: valorProtestado,
        envioProtesto: parseExcelDate(getVal(['data de envio a protesto', 'envio a protesto', 'envio protesto'])),
        status: getVal(['situacao do protesto', 'situacao', 'status']) ? String(getVal(['situacao do protesto', 'situacao', 'status'])).trim() : null,
        dataProtesto: parseExcelDate(getVal(['data do protesto', 'data protesto'])),
        juridico: getVal(['encaminhado ao juridico', 'juridico']) ? String(getVal(['encaminhado ao juridico', 'juridico'])).trim() : null,
        envioJuridico: parseExcelDate(getVal(['data envio juridico', 'dta. envio juridico', 'envio ao juridico'])),
        ar: getVal(['aviso de recebimento', 'ar']) ? String(getVal(['aviso de recebimento', 'ar'])).trim() : null,
        avalistas: getVal(['avalistas enviados', 'avalistas', 'avalista']) ? String(getVal(['avalistas enviados', 'avalistas', 'avalista'])).trim() : null,
        observacoes: getVal(['observacoes', 'observacao', 'obs']) ? String(getVal(['observacoes', 'observacao', 'obs'])).trim() : null,
        origem: originLabel,
        linha: r + 1,
        revision: 1
      });
    } else if (kind === 'negociacoes') {
      const cedente = getVal(['cedente', 'cliente', 'empresa']);
      const valor = parseExcelNumber(getVal(['valor negociado', 'valor']));
      if (!cedente && !valor) continue;

      imported.push({
        id: 'neg-' + crypto.randomUUID().slice(0, 8),
        kind: 'negociacoes',
        cedente: String(cedente || 'Sem nome').trim(),
        sacado: getVal(['sacado', 'contato']) ? String(getVal(['sacado', 'contato'])).trim() : '',
        titulo: getVal(['titulo', 'titulos']) ? String(getVal(['titulo', 'titulos'])).trim() : '',
        analista: String(getVal(['analista', 'responsavel']) || inferredAnalyst || '').trim(),
        data: parseExcelDate(getVal(['inicio da negociacao', 'data'])) || today(),
        valor: valor || 0,
        entrada: parseExcelNumber(getVal(['entrada prevista', 'entrada'])) || 0,
        parcelas: parseExcelNumber(getVal(['quantidade de parcelas', 'parcelas'])) || 1,
        previsao: parseExcelDate(getVal(['proximo vencimento', 'previsao'])),
        recebido: parseExcelNumber(getVal(['valor recebido', 'recebido'])) || 0,
        status: String(getVal(['status', 'situacao']) || 'Acordo firmado').trim(),
        condicoes: getVal(['condicoes', 'cronograma']) ? String(getVal(['condicoes', 'cronograma'])).trim() : '',
        observacoes: getVal(['historico', 'observacoes', 'obs']) ? String(getVal(['historico', 'observacoes', 'obs'])).trim() : '',
        origem: originLabel,
        linha: r + 1,
        revision: 1
      });
    } else {
      const cedente = getVal(['cedente', 'empresa', 'cliente', 'nome']);
      const sacado = getVal(['sacado', 'devedor']);
      const valor = parseExcelNumber(getVal(['valor do titulo', 'valor titulo', 'valor']));
      if ((!cedente && !sacado) || (valor === null && !sacado)) continue;
      if (/^(total|soma|media|resumo|dashboard)/i.test(String(cedente || '').trim())) continue;

      const rawAnalista = getVal(['analista', 'responsavel']);
      imported.push({
        id: 'cobrancas-' + crypto.randomUUID().slice(0, 8),
        kind: 'cobrancas',
        data: parseExcelDate(getVal(['data da cobranca', 'data cobranca', 'data'])),
        analista: String(rawAnalista || inferredAnalyst || '').trim(),
        cedente: String(cedente || sacado || 'Sem identificação').trim(),
        sacado: sacado ? String(sacado).trim() : null,
        codigo: getVal(['codigo sacado', 'cod sacado', 'codigo', 'cpf', 'cnpj']),
        titulo: getVal(['no titulo', 'nº titulo', 'numero titulo', 'titulo']),
        vencimento: parseExcelDate(getVal(['vencimento', 'data vencimento'])),
        valor: valor || 0,
        diasOriginal: parseExcelNumber(getVal(['dias em atraso', 'atraso'])),
        faixaOriginal: getVal(['faixa de atraso', 'faixa']) ? String(getVal(['faixa de atraso', 'faixa'])).trim() : null,
        ligacao1: getVal(['ligacao 1', '1a ligacao']) ? String(getVal(['ligacao 1', '1a ligacao'])).trim() : null,
        ligacao2: getVal(['ligacao 2', '2a ligacao']) ? String(getVal(['ligacao 2', '2a ligacao'])).trim() : null,
        ligacao3: getVal(['ligacao 3', '3a ligacao']) ? String(getVal(['ligacao 3', '3a ligacao'])).trim() : null,
        previsao: parseExcelDate(getVal(['previsao de pagamento', 'previsao'])),
        prometido: parseExcelNumber(getVal(['valor prometido', 'prometido'])),
        status: getVal(['status da cobranca', 'status', 'situacao']) ? String(getVal(['status da cobranca', 'status', 'situacao'])).trim() : null,
        motivo: getVal(['motivo do atraso', 'motivo']) ? String(getVal(['motivo do atraso', 'motivo'])).trim() : null,
        observacoes: getVal(['observacoes', 'observacao', 'obs']) ? String(getVal(['observacoes', 'observacao', 'obs'])).trim() : null,
        atualizacao: parseExcelDate(getVal(['data de atualizacao', 'atualizacao'])) || today(),
        origem: originLabel,
        linha: r + 1,
        revision: 1
      });
    }
  }

  return imported;
}

function handleFileUpload(files) {
  if (!files || !files.length) return;
  const kindSelect = document.getElementById('upload-kind-select');
  const modeSelect = document.getElementById('upload-mode-select');
  const analystSelect = document.getElementById('upload-analyst-select');

  const forcedKind = kindSelect ? kindSelect.value : 'auto';
  const importMode = modeSelect ? modeSelect.value : 'append';
  const defaultAnalyst = analystSelect ? analystSelect.value : '';

  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const buffer = evt.target.result;
        const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
        let fileRecords = [];

        if (forcedKind !== 'attach-only') {
          const skipSheets = ['dashboard', 'relatorio diario', 'listas', 'orientacoes', 'instrucoes'];
          const candidateSheets = wb.SheetNames.filter(sn => !skipSheets.includes(normHeader(sn)));
          const sheetsToRead = candidateSheets.length > 0 ? candidateSheets : wb.SheetNames;

          sheetsToRead.forEach(sheetName => {
            const ws = wb.Sheets[sheetName];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            const parsed = parseSheetRows(aoa, sheetName, file.name, forcedKind, defaultAnalyst);
            fileRecords.push(...parsed);
          });
        }

        let dataUrl = null;
        try {
          const bytes = new Uint8Array(buffer);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          dataUrl = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + btoa(binary);
        } catch (err) {
          dataUrl = null;
        }

        let removedIds = [];
        if (importMode === 'replace' && fileRecords.length > 0) {
          const prefix = file.name.toLowerCase();
          removedIds = state.rows
            .filter(r => r.origem && r.origem.toLowerCase().startsWith(prefix))
            .map(r => r.id);
          state.rows = state.rows.filter(r => !(r.origem && r.origem.toLowerCase().startsWith(prefix)));
        }

        if (fileRecords.length > 0) {
          state.rows.push(...fileRecords);
          saveRows();
        }

        const existingIdx = state.customSources.findIndex(s => s.name.toLowerCase() === file.name.toLowerCase());
        const sourceEntry = {
          name: file.name,
          uploadedAt: new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }),
          importedCount: fileRecords.length,
          dataUrl: dataUrl
        };
        if (existingIdx >= 0) state.customSources[existingIdx] = sourceEntry;
        else state.customSources.unshift(sourceEntry);
        saveCustomSources();

        const histEntry = {
          id: crypto.randomUUID(),
          recordId: 'planilha-' + file.name,
          at: new Date().toISOString(),
          actor: `${getCurrentActorName()} (Planilha XLSX)`,
          data: JSON.stringify({
            antes: null,
            depois: {
              cedente: `Planilha anexada: ${file.name}`,
              registrosImportados: fileRecords.length,
              abasLidas: wb.SheetNames.join(', ')
            }
          })
        };
        state.history.unshift(histEntry);
        saveHistory();

        if (supabaseClient) {
          if (removedIds.length > 0) dbDeleteRecords(removedIds);
          if (fileRecords.length > 0) dbUpsertRecords(fileRecords);
          dbUpsertSource(sourceEntry);
          dbInsertHistory(histEntry);
        }

        state.notice = fileRecords.length > 0
          ? `Planilha "${file.name}" anexada com sucesso! ${fileRecords.length} registros salvos${supabaseClient ? ' no Supabase' : ' na carteira'}.`
          : `Planilha "${file.name}" anexada em Arquivos enviados.`;
        state.error = '';
        renderAll();
      } catch (err) {
        console.error(err);
        state.error = `Não foi possível ler o arquivo "${file.name}". Verifique se é um arquivo .xlsx, .xls ou .csv válido.`;
        renderAlerts();
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

function downloadSourceFile(name, url) {
  const custom = state.customSources.find(s => s.name === name);
  if (custom && custom.dataUrl) {
    const a = document.createElement('a');
    a.href = custom.dataUrl;
    a.download = custom.name;
    a.click();
    return;
  }
  if (url) {
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    return;
  }
  const prefix = name.replace(/\s+\.xlsx$/i, '.xlsx').toLowerCase().slice(0, 6);
  const matching = state.rows.filter(r => (r.origem || '').toLowerCase().includes(prefix));
  const ws = XLSX.utils.json_to_sheet(matching.length ? matching : state.rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, name.endsWith('.xlsx') ? name : name + '.xlsx');
}

function removeCustomSource(idx, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  const s = state.customSources[idx];
  if (!s) return;
  if (!confirm(`Remover a planilha anexada "${s.name}" da lista?`)) return;
  state.customSources.splice(idx, 1);
  saveCustomSources();
  if (supabaseClient) {
    dbDeleteSource(s.name);
  }
  renderAll();
}

function exportSelectionCSV() {
  const filtered = getFilteredRows();
  if (!filtered.length) return;
  const keys = Array.from(new Set(filtered.flatMap(r => Object.keys(r))));
  const csv = '\ufeff' + [keys, ...filtered.map(r => keys.map(k => r[k] ?? ''))]
    .map(a => a.map(v => '"' + String(v).replaceAll('"', '""') + '"').join(';'))
    .join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = state.tab + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportSelectionXLSX() {
  const filtered = getFilteredRows();
  if (!filtered.length) return;
  const ws = XLSX.utils.json_to_sheet(filtered);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, TITLES[state.tab] || 'Dados');
  XLSX.writeFile(wb, `${state.tab}_${today()}.xlsx`);
}

function openNewRecord() {
  state.error = '';
  state.edit = {
    kind: state.tab,
    analista: state.user && state.user.name ? state.user.name : '',
    data: today(),
    status: state.tab === 'negociacoes' ? 'Em negociação' : ''
  };
  renderModal();
}

function openEditRecord(id) {
  if (!state.canEdit) return;
  const found = state.rows.find(r => r.id === id);
  if (!found) return;
  state.error = '';
  state.edit = JSON.parse(JSON.stringify(found));
  renderModal();
}

function closeEditModal() {
  state.edit = null;
  renderModal();
}

function createNegotiationFromCharge() {
  if (!state.edit) return;
  const c = state.edit;
  state.edit = {
    kind: 'negociacoes',
    cedente: c.cedente || '',
    sacado: c.sacado || '',
    titulo: c.titulo || '',
    analista: c.analista || (state.user ? state.user.name : ''),
    valor: c.valor || 0,
    data: today(),
    status: 'Em negociação',
    observacoes: 'Originada da cobrança ' + (c.id || '')
  };
  renderModal();
}

async function deleteCurrentRecord() {
  if (!state.edit || !state.edit.id) return;
  if (!confirm(`Deseja excluir o registro de "${state.edit.cedente}"?`)) return;
  const targetId = state.edit.id;
  const idx = state.rows.findIndex(r => r.id === targetId);
  if (idx >= 0) {
    const old = state.rows[idx];
    state.rows.splice(idx, 1);
    saveRows();
    const histEntry = {
      id: crypto.randomUUID(),
      recordId: targetId,
      at: new Date().toISOString(),
      actor: getCurrentActorName(),
      data: JSON.stringify({ antes: old, depois: { cedente: `${old.cedente} (Excluído)` } })
    };
    state.history.unshift(histEntry);
    saveHistory();

    if (supabaseClient) {
      await dbDeleteRecords([targetId]);
      await dbInsertHistory(histEntry);
    }
  }
  state.edit = null;
  state.notice = supabaseClient ? 'Registro excluído do Supabase com sucesso.' : 'Registro excluído com sucesso.';
  renderAll();
}

function updateEditField(key, type, val) {
  if (!state.edit) return;
  if (type === 'number') {
    state.edit[key] = val === '' ? '' : Number(val);
  } else {
    state.edit[key] = val;
  }
}

async function saveRecordForm(evt) {
  evt.preventDefault();
  const rec = state.edit;
  if (!rec || !rec.cedente || !String(rec.cedente).trim()) {
    state.error = 'Preencha o cedente e confira os campos.';
    renderModal();
    return;
  }

  for (const k of ['valor', 'valorNP', 'valorProtestado', 'prometido', 'entrada', 'recebido']) {
    if (rec[k] !== undefined && rec[k] !== null && rec[k] !== '' && (!Number.isFinite(Number(rec[k])) || Number(rec[k]) < 0)) {
      state.error = 'Valores devem ser números positivos.';
      renderModal();
      return;
    }
  }

  const id = rec.id || (rec.kind + '-' + crypto.randomUUID().slice(0, 8));
  const existingIdx = state.rows.findIndex(r => r.id === id);
  const old = existingIdx >= 0 ? JSON.parse(JSON.stringify(state.rows[existingIdx])) : null;

  const updated = {
    ...rec,
    id,
    cedente: String(rec.cedente).trim(),
    atualizacao: today(),
    revision: (old?.revision || 0) + 1
  };

  if (existingIdx >= 0) {
    state.rows[existingIdx] = updated;
  } else {
    state.rows.unshift(updated);
  }
  saveRows();

  const histEntry = {
    id: crypto.randomUUID(),
    recordId: id,
    at: new Date().toISOString(),
    actor: getCurrentActorName(),
    data: JSON.stringify({ antes: old, depois: updated })
  };
  state.history.unshift(histEntry);
  saveHistory();

  if (supabaseClient) {
    await dbUpsertRecords([updated]);
    await dbInsertHistory(histEntry);
  }

  state.edit = null;
  state.error = '';
  state.notice = supabaseClient ? 'Registro salvo no Supabase com sucesso.' : 'Registro salvo com sucesso.';
  renderAll();
}

function renderModal() {
  const root = document.getElementById('modal-root');
  const edit = state.edit;
  if (!edit) {
    root.innerHTML = '';
    return;
  }

  const fieldList = FIELDS[edit.kind] || [];
  const inputsHtml = fieldList.map(([k, label, t]) => {
    const val = edit[k] ?? '';
    let controlHtml = '';

    if (OPTIONS[t || '']) {
      const opts = [...new Set([...OPTIONS[t || ''], ...(val ? [String(val)] : [])])];
      controlHtml = `
        <select onchange="updateEditField('${k}', '${t || ''}', this.value)">
          <option value="">Não informado</option>
          ${opts.map(o => `<option value="${escapeHtml(o)}" ${String(val) === String(o) ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      `;
    } else if (t === 'textarea') {
      controlHtml = `<textarea oninput="updateEditField('${k}', 'textarea', this.value)">${escapeHtml(val)}</textarea>`;
    } else {
      const inputType = (t === 'date' && val && !/^\d{4}-\d{2}-\d{2}$/.test(String(val))) ? 'text' : (t || 'text');
      const minAttr = t === 'number' ? 'min="0" step="any"' : '';
      const reqAttr = k === 'cedente' ? 'required' : '';
      controlHtml = `<input ${reqAttr} type="${inputType}" ${minAttr} value="${escapeHtml(val)}" oninput="updateEditField('${k}', '${t || 'text'}', this.value)" />`;
    }

    return `<label class="${t === 'textarea' ? 'full' : ''}">${escapeHtml(label)}${controlHtml}</label>`;
  }).join('');

  const originNote = edit.origem
    ? `<p class="note">Origem: ${escapeHtml(edit.origem)} · linha ${escapeHtml(edit.linha || '—')}${edit.diasOriginal !== undefined ? ` · Atraso original: ${escapeHtml(edit.diasOriginal ?? '—')} · Faixa original: ${escapeHtml(edit.faixaOriginal ?? '—')}` : ''}</p>`
    : '';

  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeEditModal()">
      <section class="modal" role="dialog" aria-modal="true" aria-label="Editar registro">
        <div class="modal-head">
          <div>
            <div class="eyebrow">${escapeHtml(TITLES[edit.kind] || '')}</div>
            <h2>${edit.id ? 'Editar registro' : 'Novo registro'}</h2>
          </div>
          <button type="button" aria-label="Fechar" onclick="closeEditModal()">${ICONS.close}</button>
        </div>
        <form onsubmit="saveRecordForm(event)">
          <div class="form-grid">${inputsHtml}</div>
          ${originNote}
          ${state.error ? `<p class="alert" style="margin-top:14px">${escapeHtml(state.error)}</p>` : ''}
          <div class="modal-actions">
            ${edit.id ? `<button type="button" class="danger-btn" style="margin-right:auto" onclick="deleteCurrentRecord()">Excluir registro</button>` : ''}
            ${edit.kind === 'cobrancas' && edit.id ? `<button type="button" class="secondary" onclick="createNegotiationFromCharge()">Criar negociação</button>` : ''}
            <button type="button" class="secondary" onclick="closeEditModal()">Cancelar</button>
            <button type="submit" class="primary">Salvar registro</button>
          </div>
        </form>
      </section>
    </div>
  `;
}

// MODAL DE CONFIGURAÇÃO E SINCRONIZAÇÃO DO SUPABASE

function openSupabaseModal() {
  state.showSupabaseModal = true;
  renderSupabaseModal();
}

function closeSupabaseModal() {
  state.showSupabaseModal = false;
  renderSupabaseModal();
}

async function saveSupabaseConfigForm(evt) {
  evt.preventDefault();
  const urlInp = document.getElementById('sb-url-input');
  const keyInp = document.getElementById('sb-key-input');
  state.sbUrl = (urlInp ? urlInp.value : '').trim();
  state.sbKey = (keyInp ? keyInp.value : '').trim();

  if (!state.sbUrl || !state.sbKey) {
    localStorage.removeItem(STORAGE_KEYS.supabaseCfg);
    supabaseClient = null;
    state.sbStatus = 'unconfigured';
    state.sbMessage = 'Conexão desativada (usando armazenamento local).';
    renderAll();
    return;
  }

  localStorage.setItem(STORAGE_KEYS.supabaseCfg, JSON.stringify({
    url: state.sbUrl,
    key: state.sbKey
  }));

  await initSupabase(true);
  if (state.sbStatus === 'online') {
    state.notice = 'Supabase conectado e sincronizado com sucesso!';
    state.showSupabaseModal = false;
  }
  renderAll();
}

function copySupabaseSql() {
  navigator.clipboard.writeText(SUPABASE_SQL_SCHEMA);
  state.notice = 'Código SQL copiado! Cole no SQL Editor do Supabase e clique em Run.';
  renderAlerts();
}

function renderSupabaseModal() {
  const root = document.getElementById('supabase-modal-root');
  if (!root) return;
  if (!state.showSupabaseModal) {
    root.innerHTML = '';
    return;
  }

  const statusText = state.sbStatus === 'online'
    ? `🟢 Conectado ao Supabase · ${escapeHtml(state.sbMessage || 'Sincronização em tempo real ativa')}`
    : state.sbStatus === 'syncing'
      ? '🔄 Sincronizando dados com o Supabase...'
      : state.sbStatus === 'error'
        ? `🟠 Atenção: ${escapeHtml(state.sbMessage)}`
        : '⚪ Aguardando URL e Chave Anon do seu projeto Supabase.';

  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeSupabaseModal()">
      <section class="modal" role="dialog" aria-modal="true" aria-label="Configurar Supabase">
        <div class="modal-head">
          <div>
            <div class="eyebrow">BANCO DE DADOS EM NUVEM</div>
            <h2>Integração Supabase</h2>
          </div>
          <button type="button" aria-label="Fechar" onclick="closeSupabaseModal()">${ICONS.close}</button>
        </div>

        <div class="note" style="margin-top:0;margin-bottom:18px;font-weight:600">
          ${statusText}
        </div>

        <form onsubmit="saveSupabaseConfigForm(event)">
          <div class="form-grid">
            <label class="full">
              Project URL do Supabase (Settings → API → Project URL)
              <input id="sb-url-input" type="url" placeholder="https://seu-projeto.supabase.co" value="${escapeHtml(state.sbUrl)}" />
            </label>
            <label class="full">
              API Key Pública (anon / public key)
              <input id="sb-key-input" type="text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." value="${escapeHtml(state.sbKey)}" />
            </label>
          </div>

          <details class="history" style="padding:14px 0;border-bottom:0">
            <summary style="color:#176a78">1º Passo no Supabase: Ver script SQL para criar as tabelas (records, history, sources)</summary>
            <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
              <small style="margin:0">Copie e execute uma única vez no <b>SQL Editor</b> do Supabase (ou use o arquivo <code>supabase-setup.sql</code> na pasta):</small>
              <button type="button" class="secondary" onclick="copySupabaseSql()" style="padding:6px 10px;font-size:11px">Copiar SQL</button>
            </div>
            <pre style="max-height:190px;overflow:auto">${escapeHtml(SUPABASE_SQL_SCHEMA)}</pre>
          </details>

          <div class="modal-actions">
            ${supabaseClient ? `
              <button type="button" class="secondary" style="margin-right:auto" onclick="pushAllLocalToSupabase()">
                Enviar todos os ${state.rows.length} registros para o Supabase
              </button>
            ` : ''}
            <button type="button" class="secondary" onclick="closeSupabaseModal()">Fechar</button>
            <button type="submit" class="primary">Salvar e Sincronizar</button>
          </div>
        </form>
      </section>
    </div>
  `;
}

          ondrop="event.preventDefault();this.classList.remove('dragover');handleFileUpload(event.dataTransfer.files)">
          ${ICONS.fontes}
          <h3>Arraste sua planilha .XLSX aqui ou clique para selecionar</h3>
          <p>Aceita planilhas de Cobrança 10+ (Jennifer, Micael, Queila, Thais), Controle de Cedentes / Protestos / Recuperi e Negociações.</p>
          <div class="upload-controls">
            <select id="upload-kind-select" aria-label="Tipo de planilha">
              <option value="auto">Detectar aba/colunas automaticamente</option>
              <option value="cobrancas">Importar para Cobrança 10+</option>
              <option value="cedentes">Importar para Controle de cedentes</option>
              <option value="negociacoes">Importar para Negociações</option>
              <option value="attach-only">Apenas anexar arquivo (sem importar linhas)</option>
            </select>
            <select id="upload-analyst-select" aria-label="Analista padrão">
              <option value="">Analista: Automático pela planilha</option>
              <option value="Jennifer">Analista: Jennifer</option>
              <option value="Micael">Analista: Micael</option>
              <option value="Queila">Analista: Queila</option>
              <option value="Thais">Analista: Thais</option>
            </select>
            <select id="upload-mode-select" aria-label="Modo de importação">
              <option value="append">Adicionar aos registros atuais</option>
              <option value="replace">Substituir registros da mesma planilha</option>
            </select>
          </div>
          <button type="button" class="primary" onclick="document.getElementById('xlsx-upload-input').click()">
            ${ICONS.plus}Selecionar planilha (.xlsx, .xls, .csv)
          </button>
          <input type="file" id="xlsx-upload-input" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="handleFileUpload(this.files);this.value=''" />
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <h2>Arquivos enviados</h2>
          <button onclick="resetToDefaultData()" title="Restaurar dados originais de fábrica">Restaurar base original</button>
        </div>
        <p class="muted">Originais para consulta e planilhas anexadas pela equipe.</p>
        ${customListHtml}
        ${defaultListHtml}
        <div class="note">Importados ${charges.length} registros de cobrança e ${debtors.length} registros de cedentes. Linhas vazias e linhas com apenas fórmulas foram desconsideradas. Datas e observações originais permanecem disponíveis na edição.</div>
      </div>
    `;
    return;
  }

  if (tab === 'historico') {
    const itemsHtml = state.history.map(h => {
      let parsed = {};
      try { parsed = JSON.parse(h.data); } catch {}
      const labelCedente = parsed?.depois?.cedente || 'Registro';
      const dtStr = new Date(h.at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
      return `
        <details class="history">
          <summary>${escapeHtml(dtStr)} · ${escapeHtml(h.actor || 'Equipe')} · ${escapeHtml(labelCedente)}</summary>
          <pre>${escapeHtml(JSON.stringify(parsed, null, 2))}</pre>
        </details>
      `;
    }).join('');

    container.innerHTML = `
      <div class="panel">
        <h2>Últimas alterações</h2>
        <p class="muted">Autor, horário e registro alterado. Até 200 alterações mais recentes.</p>
        ${itemsHtml || '<p>Nenhuma alteração registrada ainda.</p>'}
      </div>
    `;
  }
}

function onFilterQuery(val) {
  state.query = val;
  renderWorkspaceAndCharts(true);
}

function renderWorkspaceAndCharts(preserveSearchFocus = false) {
  let selStart = null, selEnd = null;
  if (preserveSearchFocus) {
    const inp = document.getElementById('filter-search-input');
    if (inp) {
      selStart = inp.selectionStart;
      selEnd = inp.selectionEnd;
    }
  }
  renderWorkspaceContent();
  renderChartsSection();
  if (preserveSearchFocus) {
    const inp = document.getElementById('filter-search-input');
    if (inp) {
      inp.focus();
      if (selStart !== null) inp.setSelectionRange(selStart, selEnd);
    }
  }
}

function renderAll() {
  applyTheme();
  renderSupabaseStatus();
  renderSidebar();
  renderHeading();
  renderAlerts();
  renderWorkspaceContent();
  renderChartsSection();
  renderModal();
  renderSupabaseModal();
  renderLoginScreen();
}

// Inicialização imediata
loadState();
renderAll();
initSupabase(true);
</script>
</body>
</html>
